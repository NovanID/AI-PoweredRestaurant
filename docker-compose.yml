services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-powered-restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raso_minang
      POSTGRES_USER: raso_minang
      POSTGRES_PASSWORD: raso_minang_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raso_minang -d raso_minang"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
